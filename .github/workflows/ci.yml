name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:i18n
      - run: npm run build
      # Le suite che usano gli export SAP reali vengono saltate (i file non sono nel repository).
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm run test:api
        env:
          PGADMIN_URL: postgres://postgres:pw@localhost:5432/postgres
      - name: Vulnerabilità delle dipendenze di produzione
        run: npm audit --omit=dev --audit-level=high
